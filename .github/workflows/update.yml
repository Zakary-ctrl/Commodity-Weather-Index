# Commodity Weather Index : mise à jour automatique
# Toutes les heures : complète l'historique 1991-2020 dans la limite du quota Open-Meteo.
# Chaque jour à 05 h UTC : recalcul complet (prévisions, alertes, encadrés) puis mise en ligne.
name: Commodity Weather Index - mise à jour

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: commodity-weather-index
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collecte et calcul
        run: python run.py auto
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OSC_MODEL: ${{ vars.OSC_MODEL }}
      - name: Construction du site
        run: python make_dashboard.py
      - name: Sauvegarde des données dans le dépôt
        run: |
          git config user.name "observatoire-bot"
          git config user.email "observatoire-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Données du $(date -u '+%Y-%m-%d %H:%M') UTC"
                       for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
