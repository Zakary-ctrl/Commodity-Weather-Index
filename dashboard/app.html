<title>Commodity Weather Index</title>
<style>
/* Layout : poste de veille - filtres | carte mondiale | fiche zone ; fil d'alertes sous la carte */
:root{
  --bg:#000000; --panel:#0E1116; --ink:#E8E8E8; --muted:#9BA3AE; --faint:#636B75; --line:#262B33; --rule:#FB8B1E;
  --land:#46505E; --land-line:#5E6A7A; --sea:#1B222C; --accent:#FB8B1E; --accent-soft:#FB8B1E2A;
  --s0:#3FA35C; --s1:#F2C12E; --s2:#FB8B1E; --s3:#FF433D; --s4:#E0247A;
  --obs:#E8E8E8; --fc:#4AA3FF; --band:#4AA3FF22; --rain:#00B7D4; --rain-fc:#00B7D466; color-scheme:dark;
  --f-display:Arial,"Helvetica Neue",Helvetica,sans-serif;
  --f-body:Arial,"Helvetica Neue",Helvetica,sans-serif;
  --f-mono:Arial,"Helvetica Neue",Helvetica,sans-serif;
  --r:0;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --panel:#0E1116; --ink:#E8E8E8; --muted:#9BA3AE; --faint:#636B75; --line:#262B33; --rule:#FB8B1E;
  --land:#46505E; --land-line:#5E6A7A; --sea:#1B222C; --accent:#FB8B1E; --accent-soft:#FB8B1E2A;
  --s0:#3FA35C; --s1:#F2C12E; --s2:#FB8B1E; --s3:#FF433D; --s4:#E0247A;
  --obs:#E8E8E8; --fc:#4AA3FF; --band:#4AA3FF22; --rain:#00B7D4; --rain-fc:#00B7D466; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --panel:#0E1116; --ink:#E8E8E8; --muted:#9BA3AE; --faint:#636B75; --line:#262B33; --rule:#FB8B1E;
  --land:#46505E; --land-line:#5E6A7A; --sea:#1B222C; --accent:#FB8B1E; --accent-soft:#FB8B1E2A;
  --s0:#3FA35C; --s1:#F2C12E; --s2:#FB8B1E; --s3:#FF433D; --s4:#E0247A;
  --obs:#E8E8E8; --fc:#4AA3FF; --band:#4AA3FF22; --rain:#00B7D4; --rain-fc:#00B7D466; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);margin:0;font-variant-numeric:tabular-nums lining-nums}
.wrap{padding-inline:16px;padding-block:14px 32px;max-width:1680px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums lining-nums}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.eyebrow{font:600 11.5px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* barre supérieure */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:14px 0;border-top:4px solid var(--rule);border-bottom:1px solid var(--rule)}
.brand h1{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.brand p{margin:4px 0 0;color:var(--muted);font-size:14px;}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:0;padding:3px;background:var(--panel)}
.seg button{border:0;background:none;padding:5px 14px;border-radius:0;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.top .spacer{flex:1}
.fresh{font:12px/1.35 var(--f-mono);color:var(--muted);text-align:right}
.counts{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:0;padding:2px 9px 2px 7px;font:500 11.5px/1.6 var(--f-mono);border:1px solid var(--line);background:var(--panel);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--s0));flex:none}

/* grille principale */
.grid{display:grid;grid-template-columns:220px minmax(0,1fr) 430px;grid-template-rows:auto 1fr;grid-template-areas:"filters map fiche" "filters feed fiche";gap:16px;margin-top:16px;align-items:start}
.filters{grid-area:filters;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px)}
.mapcol{grid-area:map;min-width:0}
.feed{grid-area:feed;min-width:0}
.fiche{grid-area:fiche;min-width:0;display:flex;flex-direction:column;gap:14px}
@media (max-width:1240px){
  .grid{grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto auto 1fr;grid-template-areas:"filters filters" "map fiche" "feed fiche"}
  .filters{position:static;flex-direction:row;flex-wrap:wrap;gap:12px 22px}
}
@media (max-width:900px){
  .grid{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-template-areas:"filters" "map" "fiche" "feed"}
  .zoomctl button{width:26px;height:26px}
}

/* filtres */
.fgroup{display:flex;flex-direction:column;gap:6px;min-width:0}
.fgroup h3{font:500 11px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.chk input{accent-color:var(--accent);margin:0}
.chk .n{margin-left:auto;color:var(--faint);font:11.5px var(--f-mono)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:0;padding:3px 10px;font-size:12.5px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--bg);box-shadow:inset 0 0 0 1px var(--ink)}
@media (max-width:1240px){.fgroup.cult{flex-direction:row;flex-wrap:wrap;gap:6px 14px;align-items:center}.fgroup.cult h3{width:100%}.chk .n{margin-left:2px}}

/* carte */
.maphead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:8px}
.layers{display:flex;flex-wrap:wrap;gap:6px}
.layers button{border:1px solid var(--line);background:var(--panel);border-radius:0;padding:5px 10px;font-size:12.5px;color:var(--muted)}
.layers button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mapbox{position:relative;background:var(--sea);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
#map{display:block;width:100%;height:auto;touch-action:none}
.land{fill:var(--land);stroke:var(--land-line);stroke-width:.5}
.grat{fill:none;stroke:var(--land-line);stroke-width:.4;opacity:.55}
.zpt{stroke:var(--panel);stroke-width:1.2;cursor:pointer;transition:opacity .2s}
.zpt.dim{opacity:.18}
.zring{fill:none;stroke:var(--accent);stroke-width:2.2;pointer-events:none}
.zpulse{fill:none;stroke-width:1.6;pointer-events:none;animation:pulse 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.4)}}
@media (prefers-reduced-motion:reduce){.zpulse{animation:none;opacity:.5}}
.zlabel{font:600 11px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.zoomctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.zoomctl button{width:30px;height:30px;border-radius:0;border:1px solid var(--line);background:var(--panel);font:600 16px/1 var(--f-mono)}
.legend{position:relative;margin:0 10px 10px;display:inline-block;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:0;padding:7px 10px;font-size:11.5px;max-width:calc(100% - 20px)}
.legend .t{font:500 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.legend .bar{height:8px;width:200px;max-width:100%;border-radius:0}
.legend .ticks{display:flex;justify-content:space-between;width:200px;max-width:100%;font:10.5px var(--f-mono);color:var(--muted);margin-top:2px}
.legend .sevs{display:flex;flex-wrap:wrap;gap:4px 10px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.35;padding:6px 9px;border-radius:0;max-width:240px;opacity:0;transition:opacity .12s}
.tip b{font-weight:600}
.mapnote{font-size:12px;color:var(--muted);margin-top:6px}

/* fil d'alertes */
.feed h2{font-size:20px;font-weight:700;border-top:2px solid var(--rule);padding-top:8px;margin:18px 0 8px;display:flex;align-items:baseline;gap:10px}
.feed h2 .eyebrow{}
.alist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.alist li{border-bottom:1px solid var(--line)}
.alist button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:112px minmax(0,1.3fr) minmax(0,1.6fr) minmax(0,1fr);gap:12px;align-items:center;width:100%;padding:9px 6px}
.alist button:hover,.alist button:focus-visible{background:var(--panel)}
.alist .z{font-weight:600}
.alist .z small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.alist .ph{font-size:13px}
.alist .ct{font:12px var(--f-mono);color:var(--muted)}
@media (max-width:640px){.alist button{grid-template-columns:100px minmax(0,1fr)}.alist .ph{grid-column:2}.alist .ct{grid-column:2}}
.sev{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--f-mono);letter-spacing:.03em;text-transform:uppercase;color:var(--c)}
.sev i{display:inline-flex;gap:2px}
.sev i b{width:5px;height:12px;border-radius:0;background:var(--c);opacity:.22}
.sev i b.on{opacity:1}

/* fiche zone */
.zhead{display:flex;gap:14px;align-items:flex-start}
.zhead .t{flex:1;min-width:0}
.zhead h2{font-size:28px;font-weight:700;letter-spacing:-.01em;line-height:1.05;margin-top:3px}
.cults{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.cults span{font-size:12px;border:1px solid var(--line);border-radius:0;padding:1px 7px;color:var(--muted)}
.score{flex:none;width:74px;text-align:center}
.score svg{display:block;margin:0 auto}
.score .l{font:10.5px var(--f-mono);color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.card{background:var(--panel);border:0;border-top:2px solid var(--rule);border-radius:var(--r);padding:16px 18px;position:relative;overflow:hidden}
.card.encadre{border-left:5px solid var(--c,var(--s0))}
.encadre h3{font-size:19px;font-weight:700;line-height:1.2;margin:6px 0 10px}
.encadre dl{margin:0;display:grid;gap:9px}
.encadre dt{font:500 10.5px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.encadre dd{margin:1px 0 0;font-size:15px;line-height:1.5}
.encadre .resume{margin:12px 0 0;padding-top:10px;border-top:1px solid var(--line);font:600 14px/1.45 var(--f-body);color:var(--ink)}
.encadre .meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:12px;font-size:11.5px;color:var(--faint)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:0;padding:6px 12px;font-size:12.5px;font-weight:500}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn[disabled]{opacity:.55;cursor:progress}
.mkt{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.mkt span{font:500 11.5px var(--f-mono);border-radius:0;padding:1px 7px;background:var(--accent-soft);color:var(--ink)}
.plain{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.plain li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-size:13.5px;line-height:1.45}
.plain .ic{font:600 13px var(--f-mono);color:var(--muted)}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.sect h3{font-size:16px;font-weight:700;}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-4px 0 10px;overflow-x:auto}
.tabs button{border:0;background:none;padding:7px 10px;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{font:10.5px var(--f-mono);fill:var(--muted)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .today{stroke:var(--ink);stroke-dasharray:3 3;stroke-width:1}
.ckey{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--muted);margin-top:6px}
.ckey i{display:inline-block;width:16px;height:0;border-top:2px solid var(--c);vertical-align:middle;margin-right:5px}
.ckey i.d{border-top-style:dashed}
.ckey i.b{height:9px;border:0;background:var(--c);border-radius:0}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{font:500 10.5px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.num{text-align:right;white-space:nowrap}
table.t th.num{text-align:right}
.tscroll{overflow-x:auto}
.st{font:500 11px var(--f-mono);white-space:nowrap}
.cal{display:grid;grid-template-columns:minmax(110px,1fr) repeat(12,minmax(11px,18px));gap:2px;align-items:center;font-size:12px}
.cal .m{font:10.5px var(--f-mono);color:var(--muted);text-align:center}
.cal .m.now{color:var(--ink);font-weight:600}
.cal .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:6px}
.cal .c{height:14px;border-radius:0;background:var(--line);opacity:.5}
.cal .c.l1{background:var(--accent);opacity:.28}
.cal .c.l2{background:var(--accent);opacity:.58}
.cal .c.l3{background:var(--accent);opacity:1}
.cal .c.now{outline:1.5px solid var(--ink);outline-offset:1px}
.foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:grid;gap:6px;max-width:980px}
.foot a{color:var(--accent)}
.muted{color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
[data-view="public"] .analyst-only{display:none!important}
[data-view="analyst"] .public-only{display:none!important}
.err{color:var(--s3);font-size:12px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font:inherit;text-decoration:underline;text-underline-offset:2px}
.livedot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--s0);margin-right:6px;vertical-align:1px;box-shadow:0 0 0 3px color-mix(in srgb,var(--s0) 25%,transparent)}

/* touches terminal */
.layers button[aria-pressed="true"]{background:var(--accent)!important;color:#000!important;border-color:var(--accent)!important;font-weight:700}
.chip[aria-pressed="true"]{border-color:var(--accent)!important;color:var(--accent)!important;box-shadow:inset 0 0 0 1px var(--accent)!important}
.btn{background:var(--accent)!important;border-color:var(--accent)!important;color:#000!important;font-weight:700}
.brand h1{color:var(--accent)}
.brand p{color:var(--muted)}
.eyebrow,.fgroup h3,.legend .t,.encadre dt,table.t th,.score .l{color:var(--accent)!important}
.seg button[aria-pressed="true"]{background:var(--accent)!important;color:#000!important}
.top{border-top-width:3px}
.card{border-top-color:var(--line)!important}
.card.encadre{border-top-color:var(--line)!important}
.alist button:hover,.alist button:focus-visible{background:#15191F}
.fresh{color:var(--faint)}
a{color:#4AA3FF}
.tip{background:#1A1F27!important;color:var(--ink)!important;border:1px solid var(--accent)}

/* prix, actualités, backtest */
.news{margin-top:16px}
.news h2{font-size:20px;font-weight:700;border-top:2px solid var(--rule);padding-top:8px;margin:0 0 6px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.nlist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.nlist li{display:flex;flex-direction:column;gap:2px;padding:8px 6px;border-bottom:1px solid var(--line)}
.nlist a{color:var(--ink);text-decoration:none;font-weight:600;line-height:1.35}
.nlist a:hover{color:var(--accent);text-decoration:underline}
.nlist .muted{font-size:12px}
.mk{padding:10px 0;border-top:1px solid var(--line)}
.mk:first-of-type{border-top:0}
.mkh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.mkh .num{font-size:17px;font-weight:700}
.spark{display:block;width:100%;height:64px;margin:6px 0 4px}
.mkc{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.up{color:var(--s0)}.down{color:var(--s3)}
.mkread{margin:4px 0 2px;padding:8px 10px;border-left:3px solid var(--accent);background:var(--accent-soft);font-size:13.5px}
.alist .ct .up,.alist .ct .down{font-size:11.5px}
.btstrip{display:grid;grid-template-columns:repeat(30,1fr);gap:2px}
.btstrip span{height:22px}
.btyears{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:3px}
.yr{display:inline-block;font-size:11px;padding:0 4px;margin:1px 2px 1px 0;border-left:3px solid var(--c);background:var(--accent-soft)}
.bth{font-size:13px;margin:14px 0 6px;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.evl{list-style:none;margin:0;padding:0}
.evl li{display:flex;gap:10px;padding:6px 4px;border-bottom:1px solid var(--line);font-size:13.5px;align-items:baseline}
.evl li[data-z]:hover{background:#15191F}
.evs{flex:none;width:18px;text-align:center;font-weight:700;color:var(--faint)}
.evs.ok{color:var(--s0)}.evs.ko{color:var(--s3)}
</style>

<div class="wrap" id="app" data-view="public">
  <header class="top">
    <div class="brand">
      <h1>Commodity Weather Index</h1>
      <p id="tagline"></p>
    </div>
    <div class="seg" role="group" id="viewseg">
      <button id="v-public" aria-pressed="true"></button>
      <button id="v-analyst" aria-pressed="false"></button>
    </div>
    <div class="seg" role="group" aria-label="Langue / Language">
      <button id="lang-fr" aria-pressed="false">FR</button>
      <button id="lang-en" aria-pressed="false">EN</button>
    </div>
    <div class="spacer"></div>
    <div class="counts" id="counts"></div>
    <div class="fresh" id="fresh"></div>
  </header>

  <main class="grid">
    <aside class="filters" aria-label="Filtres">
      <div class="fgroup cult" id="f-cult"><h3 id="h-cult"></h3></div>
      <div class="fgroup"><h3 id="h-cont"></h3><div class="chips" id="f-cont"></div></div>
      <div class="fgroup"><h3 id="h-sev"></h3><div class="chips" id="f-sev"></div></div>
    </aside>

    <section class="mapcol" aria-label="Carte mondiale">
      <div class="maphead">
        <div class="layers" id="layers" role="group" aria-label="Couche affichée"></div>
      </div>
      <div class="mapbox" id="mapbox">
        <svg id="map" role="img" aria-label="Carte mondiale des zones de production"></svg>
        <div class="zoomctl"><button id="zin" aria-label="Zoomer">+</button><button id="zout" aria-label="Dézoomer">-</button><button id="zreset" aria-label="Vue mondiale" style="font-size:12px">⌂</button></div>
        <div class="legend" id="legend"></div>
        <div class="tip" id="tip" role="status"></div>
      </div>
      <p class="mapnote" id="mapnote"></p>
      <section class="news" id="news" aria-live="polite"></section>
    </section>

    <section class="feed">
      <h2><span id="h-feed"></span> <span class="eyebrow" id="feeddate"></span></h2>
      <ul class="alist" id="alist"></ul>
      <div id="btglobal"></div>
    </section>

    <aside class="fiche" id="fiche" aria-live="polite"></aside>
  </main>

  <footer class="foot" id="foot"></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<!--DATA-->
<script>
(() => {
const D0 = window.OSC_DATA, W = window.OSC_WORLD, NORM = window.OSC_NORMALS || {}, X = window.OSC_EXTRA || {};
const D = {...D0};  // état courant : remplacé par le recalcul en direct quand il réussit
const app = document.getElementById('app');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = { get(k,d){ try{ const v = localStorage.getItem('osc:'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} }, set(k,v){ try{ localStorage.setItem('osc:'+k, JSON.stringify(v)); }catch(e){} } };

    + '&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,et0_fao_evapotranspiration&past_days=30&forecast_days=16&timezone=GMT&models=best_match';
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 20000);

    const orig = D0.zones.find(x => x.id === z.id);
    z.alertes = evaluateZone(z, m, month);
    z.metriques = m; z.series = {tx: s.tx, tn: s.tn, pr: s.pr, et0: s.et0, ntx: s.ntx, ntn: s.ntn, npr: s.npr};
    z.score = riskScore(m, z.alertes, z.stades); z.sev = z.alertes.length ? z.alertes[0].severite : 0;
    if (!z.alertes.length){ z.encadre = null; z.bulletin = calmBulletin(z, m, z.stades); }
    else if (orig?.encadre && orig.encadre.alerte_id === z.alertes[0].id){ z.encadre = {...orig.encadre, ecrit_le: D0.genere_le}; z.bulletin = null; }
    else { z.encadre = templateEncadre(buildPayload(z)); z.bulletin = null; }
  });
}

const svg = d3.select('#map');
let proj, path, gRoot, zoom, curK = 1;
function initMap(){
  const w = 1000;

  path = d3.geoPath(proj);
  const bb = path.bounds(W), h = Math.ceil(bb[1][1] - bb[0][1]) + 16;
  proj.translate([proj.translate()[0] + 8, proj.translate()[1] - bb[0][1] + 8]);
  svg.attr('viewBox', `0 0 ${w} ${h}`);
  svg.selectAll('*').remove();
  gRoot = svg.append('g');
  gRoot.append('path').attr('class','grat').attr('d', path(d3.geoGraticule10()));
  gRoot.append('g').selectAll('path').data(W.features).join('path').attr('class','land').attr('d', path);
  gRoot.append('g').attr('id','zlayer');
  gRoot.append('g').attr('id','llayer');
  zoom = d3.zoom().scaleExtent([1, 8]).translateExtent([[0,0],[w,h]]).on('zoom', e => { curK = e.transform.k; gRoot.attr('transform', e.transform); drawZones(); });
  svg.call(zoom).on('dblclick.zoom', null);
  $('zin').onclick = () => svg.transition().duration(300).call(zoom.scaleBy, 1.6);
  $('zout').onclick = () => svg.transition().duration(300).call(zoom.scaleBy, 1/1.6);

const PX = X.prices || {};
function priceInfo(cfr){ const c = PX.contrats && PX.contrats[cfr]; if (!c) return null; const s = PX.series && PX.series[c.ticker]; return s && s.close && s.close.length > 25 ? {...c, s} : null; }

  const l = arr => d3.line().x((d,i) => x(i)).y(d => yc(d))(arr);
  const right = yc.ticks(4).map(v => `<text class="ax" x="${CW-M.r+4}" y="${yc(v)+3.5}">${v}</text>`).join('');
  return `<div class="chart"><svg viewBox="0 0 ${CW+24} ${CH}" role="img" aria-label="${T('Pluie quotidienne et cumul comparé à la normale', 'Daily rain and cumulative total against normal')}">
    ${yAxis(yb, v => v)}${xAxis(x)}${bars}
    ${hasN ? `<path d="${l(nc)}" fill="none" stroke="var(--faint)" stroke-width="1.5" stroke-dasharray="2 2"/>` : ''}
    <path d="${l(c)}" fill="none" stroke="var(--ink)" stroke-width="1.8"/>${right}
    </svg>
    <div class="ckey"><span><i class="b" style="--c:var(--rain)"></i>${T('pluie du jour (mm, axe gauche)', 'daily rain (mm, left axis)')}</span><span><i class="b" style="--c:var(--rain-fc)"></i>${T('prévue', 'forecast')}</span><span><i style="--c:var(--ink)"></i>${T('cumul (mm, axe droit)', 'cumulative (mm, right axis)')}</span>${hasN ? `<span><i class="d" style="--c:var(--faint)"></i>${T('cumul normal', 'normal cumulative')}</span>` : ''}</div>
    <p class="hint" style="margin:8px 0 0">${T('30 j :', '30 d:')} <span class="num">${m.pr_obs30_mm} mm</span>${m.pr_obs30_normal != null ? ` ${T('pour une normale de', 'vs a normal of')} <span class="num">${m.pr_obs30_normal} mm</span>` : ''}${m.pr_obs30_rank != null ? ` (${T('rang', 'rank')} ${m.pr_obs30_rank}/100)` : ''} · ${T('bilan pluie - ETP :', 'rain minus ET0:')} <span class="num">${m.wb_obs30} mm</span></p></div>`;
}
function indTable(z){
  const m = z.metriques, nd = v => v == null ? ND : v, an = T('écart à la normale', 'departure from normal'), nm = T('normale', 'normal'), rk = T('rang', 'rank'), pc = EN ? '%' : ' %';
  const rows = [
    [T('Tmax moyenne, 7 j prévus', 'Mean Tmax, next 7 d'), signC(m.tx_fc7_anom), an],
    [T('Tmax, z-score 7 j', 'Tmax z-score, 7 d'), n1(m.tx_fc7_z), T('écart / écart-type journalier', 'departure / daily std. dev.')],
    [T('Tmax moyenne, 7 j passés', 'Mean Tmax, past 7 d'), signC(m.tx_obs7_anom), an],
    [T('Tmin moyenne, 7 j prévus', 'Mean Tmin, next 7 d'), signC(m.tn_fc7_anom), an],
    [T('Tmax la plus haute, 7 j', 'Highest Tmax, 7 d'), n1(m.tx_fc7_max) + ' °C', T('prévision', 'forecast')],
    [T('Tmin la plus basse, 7 j', 'Lowest Tmin, 7 d'), n1(m.tn_fc7_min) + ' °C', T('prévision', 'forecast')],
    [T('Pluie, 30 j passés', 'Rain, past 30 d'), m.pr_obs30_mm + ' mm', `${nm} ${nd(m.pr_obs30_normal)} mm · ${nd(m.pr_obs30_pct)}${pc} · ${rk} ${nd(m.pr_obs30_rank)}`],
    [T('Pluie, 14 j prévus', 'Rain, next 14 d'), m.pr_fc14_mm + ' mm', `${nm} ${nd(m.pr_fc14_normal)} mm · ${nd(m.pr_fc14_pct)}${pc} · ${rk} ${nd(m.pr_fc14_rank)}`],
    [T('Bilan pluie - ETP, 30 j', 'Rain minus ET0, 30 d'), m.wb_obs30 + ' mm', T("négatif = sol qui s'assèche", 'negative = drying soil')],
  ];
  return `<div class="tscroll"><table class="t"><thead><tr><th>${T('Indicateur', 'Indicator')}</th><th class="num">${T('Valeur', 'Value')}</th><th>${T('Référence', 'Reference')}</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td>${r[0]}</td><td class="num">${r[1]}</td><td class="muted">${r[2]}</td></tr>`).join('')}</tbody></table></div>
    <p class="hint" style="margin:8px 0 0">${T('Rang = position du cumul actuel parmi les 30 années 1991-2020 (0 = le plus sec, 100 = le plus humide). n.d. = normale pas encore disponible.', 'Rank = position of the current total among the 30 years 1991-2020 (0 = driest, 100 = wettest). n/a = normal not yet available.')}</p>`;
}
const METRIC = T({pr_obs30_pct:'Pluie 30 j (% normale)', pr_fc14_pct:'Pluie prévue 14 j (% normale)', tn_fc7_min:'Tmin la plus basse 7 j (°C)', tx_fc7_max:'Tmax la plus haute 7 j (°C)', n_tx_gt:'Jours > {t} °C sur 10 j'},
  {pr_obs30_pct:'Rain 30 d (% normal)', pr_fc14_pct:'Rain forecast 14 d (% normal)', tn_fc7_min:'Lowest Tmin 7 d (°C)', tx_fc7_max:'Highest Tmax 7 d (°C)', n_tx_gt:'Days > {t} °C in 10 d'});
function ruleValue(z, r){
  if (r.metrique === 'n_tx_gt'){ return z.series.tx.slice(D.i0, D.i0+10).filter(t => t != null && t > r.t).length; }
  const m = z.metriques;
  if (r.metrique.endsWith('_pct')){ const normal = m[r.metrique.replace('_pct','_normal')]; if (normal == null || normal < 15) return null; }
  return m[r.metrique];
}
function fmtU(x, r){
  const u = r.metrique.endsWith('_pct') ? T(' % de la normale', '% of normal') : r.metrique === 'n_tx_gt' ? T(' j', ' d') : ' °C';
  return fr(x) + u;
}
function rulesTable(z){
  const rows = z.regles.map(r => {
    const active = r.mois.includes(month), hitA = z.alertes.find(a => a.id === r.id), v = ruleValue(z, r);
    const normalMissing = r.metrique.endsWith('_pct') && z.metriques[r.metrique.replace('_pct','_normal')] == null;
    const st = hitA ? `<span class="st" style="color:${sevVar(hitA.severite)}">● ${SEV[hitA.severite]}</span>` : !active ? `<span class="st muted">${T('hors saison', 'out of season')}</span>` : normalMissing ? `<span class="st muted">${T('normale en calcul', 'normal pending')}</span>` : v == null ? `<span class="st muted">${T('saison sèche', 'dry season')}</span>` : `<span class="st" style="color:var(--s0)">○ ${T('non franchi', 'not crossed')}</span>`;
    const b = btFreq(r), fq = b ? `<br><span class="muted">${T('backtest', 'backtest')} : ${b.frequence}${EN ? '%' : ' %'} ${T('des années', 'of years')}</span>` : '';
    return `<tr><td>${esc(r.phenomene)}<br><span class="muted">${esc(r.culture)} · ${r.mois.map(m => MOIS1[m-1]).join('')}</span></td>
      <td>${esc(METRIC[r.metrique].replace('{t}', r.t))}</td><td class="num">${v == null ? '-' : fmtU(v, r)}<br><span class="muted">${T('alerte si', 'alert if')} ${r.op === '<' ? '<' : r.op === '>' ? '>' : '≥'} ${fmtU(r.seuil, r)}</span></td><td>${st}${fq}</td></tr>`;
  }).join('');
  return `<div class="tscroll"><table class="t"><thead><tr><th>${T('Règle', 'Rule')}</th><th>${T('Indicateur', 'Indicator')}</th><th class="num">${T('Valeur actuelle', 'Current value')}</th><th>${T('Statut', 'Status')}</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="hint" style="margin:8px 0 0">${T("Seuils agronomiques de départ ; l'onglet Backtest montre combien de fois chaque règle se serait déclenchée sur 1991-2020. La sévérité monte d'un cran quand le seuil sévère est aussi franchi.", 'Starting agronomic thresholds; the Backtest tab shows how often each rule would have fired over 1991-2020. Severity goes up one notch when the severe threshold is also crossed.')}</p>`;
}

/* ================= rédaction par Claude (dans claude.ai uniquement) ================= */
let sampleFn;
async function runLLM(z){
  const sample = sampleFn; if (!sample) return;
  const ctl = new AbortController();
  state.llm[z.id] = {...(state.llm[z.id]||{}), busy: true, ctl, msg: 'Claude réfléchit…', err: false};
  renderFiche();
  const p = buildPayload(z);
  const extra = p.severite === 0 ? "\nCAS SANS ALERTE : 60 à 90 mots, dis clairement que l'impact de marché attendu est limité, direction \"neutre\"." : '';
  const prompt = D0.system_prompt + extra + '\n\n<alerte>\n' + JSON.stringify(p) + '\n</alerte>';
  try {
    const out = await sample.json(prompt, {signal: ctl.signal, cache: false, onText: () => { const s = state.llm[z.id]; if (s && s.msg !== 'Rédaction…'){ s.msg = 'Rédaction…'; const el = $('llm-msg'); if (el) el.textContent = s.msg; } }});
    if (!out || !out.ce_qui_se_passe) throw {code: 'invalid_json'};
    state.llm[z.id] = {out, busy: false, msg: 'Nouvelle version affichée pour cette session.'};
  } catch (e) {
    const copy = {cancelled: 'Rédaction arrêtée.', not_granted: 'Rédaction par Claude non autorisée sur cette page.', rate_limited: 'Trop de demandes, réessayez dans un moment.', invalid_json: 'Réponse inexploitable, réessayez.', sampling_disabled: "Claude n'est pas disponible pour ce compte."};
    state.llm[z.id] = {...(state.llm[z.id]||{}), busy: false, err: e.code !== 'cancelled', msg: copy[e.code] || 'La rédaction a échoué, réessayez.'};
    if (['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e.code)) sampleFn = null;
  }
  if (state.sel === z.id) renderFiche();
}

function refresh(){ drawZones(); renderFeed(); if (!visible(byId[state.sel])){ const f = zones.filter(visible).sort((a,b) => b.score-a.score)[0]; if (f) state.sel = f.id; } renderFiche(); renderNews(); }

renderTop(); renderFilters(); renderLayers(); initMap(); renderLegend(); renderFeed(); renderFoot(); renderNews(); renderBtGlobal();
setView(state.view);
drawZones();
goLive(false);

  try { sampleFn = window.claude ? await window.claude.use('sample') : null; } catch (e) { sampleFn = null; }

})();
})();
