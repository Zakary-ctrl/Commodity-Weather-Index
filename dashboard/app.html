<title>Commodity Weather Index</title>
<style>
/* Layout : poste de veille - filtres | carte mondiale | fiche zone ; fil d'alertes sous la carte */
:root{
  --bg:#000000; --panel:#0E1116; --ink:#E8E8E8; --muted:#9BA3AE; --faint:#636B75; --line:#262B33; --rule:#FB8B1E;
  --land:#46505E; --land-line:#5E6A7A; --sea:#1B222C; --accent:#FB8B1E; --accent-soft:#FB8B1E2A;
  --s0:#3FA35C; --s1:#F2C12E; --s2:#FB8B1E; --s3:#FF433D; --s4:#E0247A;
  --obs:#E8E8E8; --fc:#4AA3FF; --band:#4AA3FF22; --rain:#00B7D4; --rain-fc:#00B7D466; color-scheme:dark;
  --f-display:Arial,"Helvetica Neue",Helvetica,sans-serif;
  --f-body:Arial,"Helvetica Neue",Helvetica,sans-serif;
  --f-mono:Arial,"Helvetica Neue",Helvetica,sans-serif;
  --r:0;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --panel:#0E1116; --ink:#E8E8E8; --muted:#9BA3AE; --faint:#636B75; --line:#262B33; --rule:#FB8B1E;
  --land:#46505E; --land-line:#5E6A7A; --sea:#1B222C; --accent:#FB8B1E; --accent-soft:#FB8B1E2A;
  --s0:#3FA35C; --s1:#F2C12E; --s2:#FB8B1E; --s3:#FF433D; --s4:#E0247A;
  --obs:#E8E8E8; --fc:#4AA3FF; --band:#4AA3FF22; --rain:#00B7D4; --rain-fc:#00B7D466; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --panel:#0E1116; --ink:#E8E8E8; --muted:#9BA3AE; --faint:#636B75; --line:#262B33; --rule:#FB8B1E;
  --land:#46505E; --land-line:#5E6A7A; --sea:#1B222C; --accent:#FB8B1E; --accent-soft:#FB8B1E2A;
  --s0:#3FA35C; --s1:#F2C12E; --s2:#FB8B1E; --s3:#FF433D; --s4:#E0247A;
  --obs:#E8E8E8; --fc:#4AA3FF; --band:#4AA3FF22; --rain:#00B7D4; --rain-fc:#00B7D466; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);margin:0;font-variant-numeric:tabular-nums lining-nums}
.wrap{padding-inline:16px;padding-block:14px 32px;max-width:1680px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums lining-nums}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.eyebrow{font:600 11.5px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* barre supérieure */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:14px 0;border-top:4px solid var(--rule);border-bottom:1px solid var(--rule)}
.brand h1{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.brand p{margin:4px 0 0;color:var(--muted);font-size:14px;}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:0;padding:3px;background:var(--panel)}
.seg button{border:0;background:none;padding:5px 14px;border-radius:0;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.top .spacer{flex:1}
.fresh{font:12px/1.35 var(--f-mono);color:var(--muted);text-align:right}
.counts{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:0;padding:2px 9px 2px 7px;font:500 11.5px/1.6 var(--f-mono);border:1px solid var(--line);background:var(--panel);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--s0));flex:none}

/* grille principale */
.grid{display:grid;grid-template-columns:220px minmax(0,1fr) 430px;grid-template-rows:auto 1fr;grid-template-areas:"filters map fiche" "filters feed fiche";gap:16px;margin-top:16px;align-items:start}
.filters{grid-area:filters;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px)}
.mapcol{grid-area:map;min-width:0}
.feed{grid-area:feed;min-width:0}
.fiche{grid-area:fiche;min-width:0;display:flex;flex-direction:column;gap:14px}
@media (max-width:1240px){
  .grid{grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto auto 1fr;grid-template-areas:"filters filters" "map fiche" "feed fiche"}
  .filters{position:static;flex-direction:row;flex-wrap:wrap;gap:12px 22px}
}
@media (max-width:900px){
  .grid{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-template-areas:"filters" "map" "fiche" "feed"}
  .zoomctl button{width:26px;height:26px}
}

/* filtres */
.fgroup{display:flex;flex-direction:column;gap:6px;min-width:0}
.fgroup h3{font:500 11px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.chk input{accent-color:var(--accent);margin:0}
.chk .n{margin-left:auto;color:var(--faint);font:11.5px var(--f-mono)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:0;padding:3px 10px;font-size:12.5px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--bg);box-shadow:inset 0 0 0 1px var(--ink)}
@media (max-width:1240px){.fgroup.cult{flex-direction:row;flex-wrap:wrap;gap:6px 14px;align-items:center}.fgroup.cult h3{width:100%}.chk .n{margin-left:2px}}

/* carte */
.maphead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:8px}
.layers{display:flex;flex-wrap:wrap;gap:6px}
.layers button{border:1px solid var(--line);background:var(--panel);border-radius:0;padding:5px 10px;font-size:12.5px;color:var(--muted)}
.layers button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mapbox{position:relative;background:var(--sea);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
#map{display:block;width:100%;height:auto;touch-action:none}
.land{fill:var(--land);stroke:var(--land-line);stroke-width:.5}
.grat{fill:none;stroke:var(--land-line);stroke-width:.4;opacity:.55}
.zpt{stroke:var(--panel);stroke-width:1.2;cursor:pointer;transition:opacity .2s}
.zpt.dim{opacity:.18}
.zring{fill:none;stroke:var(--accent);stroke-width:2.2;pointer-events:none}
.zpulse{fill:none;stroke-width:1.6;pointer-events:none;animation:pulse 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.4)}}
@media (prefers-reduced-motion:reduce){.zpulse{animation:none;opacity:.5}}
.zlabel{font:600 11px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.zoomctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.zoomctl button{width:30px;height:30px;border-radius:0;border:1px solid var(--line);background:var(--panel);font:600 16px/1 var(--f-mono)}
.legend{position:relative;margin:0 10px 10px;display:inline-block;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:0;padding:7px 10px;font-size:11.5px;max-width:calc(100% - 20px)}
.legend .t{font:500 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.legend .bar{height:8px;width:200px;max-width:100%;border-radius:0}
.legend .ticks{display:flex;justify-content:space-between;width:200px;max-width:100%;font:10.5px var(--f-mono);color:var(--muted);margin-top:2px}
.legend .sevs{display:flex;flex-wrap:wrap;gap:4px 10px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.35;padding:6px 9px;border-radius:0;max-width:240px;opacity:0;transition:opacity .12s}
.tip b{font-weight:600}
.mapnote{font-size:12px;color:var(--muted);margin-top:6px}

/* fil d'alertes */
.feed h2{font-size:20px;font-weight:700;border-top:2px solid var(--rule);padding-top:8px;margin:18px 0 8px;display:flex;align-items:baseline;gap:10px}
.feed h2 .eyebrow{}
.alist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.alist li{border-bottom:1px solid var(--line)}
.alist button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:112px minmax(0,1.3fr) minmax(0,1.6fr) minmax(0,1fr);gap:12px;align-items:center;width:100%;padding:9px 6px}
.alist button:hover,.alist button:focus-visible{background:var(--panel)}
.alist .z{font-weight:600}
.alist .z small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.alist .ph{font-size:13px}
.alist .ct{font:12px var(--f-mono);color:var(--muted)}
@media (max-width:640px){.alist button{grid-template-columns:100px minmax(0,1fr)}.alist .ph{grid-column:2}.alist .ct{grid-column:2}}
.sev{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--f-mono);letter-spacing:.03em;text-transform:uppercase;color:var(--c)}
.sev i{display:inline-flex;gap:2px}
.sev i b{width:5px;height:12px;border-radius:0;background:var(--c);opacity:.22}
.sev i b.on{opacity:1}

/* fiche zone */
.zhead{display:flex;gap:14px;align-items:flex-start}
.zhead .t{flex:1;min-width:0}
.zhead h2{font-size:28px;font-weight:700;letter-spacing:-.01em;line-height:1.05;margin-top:3px}
.cults{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.cults span{font-size:12px;border:1px solid var(--line);border-radius:0;padding:1px 7px;color:var(--muted)}
.score{flex:none;width:74px;text-align:center}
.score svg{display:block;margin:0 auto}
.score .l{font:10.5px var(--f-mono);color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.card{background:var(--panel);border:0;border-top:2px solid var(--rule);border-radius:var(--r);padding:16px 18px;position:relative;overflow:hidden}
.card.encadre{border-left:5px solid var(--c,var(--s0))}
.encadre h3{font-size:19px;font-weight:700;line-height:1.2;margin:6px 0 10px}
.encadre dl{margin:0;display:grid;gap:9px}
.encadre dt{font:500 10.5px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.encadre dd{margin:1px 0 0;font-size:15px;line-height:1.5}
.encadre .resume{margin:12px 0 0;padding-top:10px;border-top:1px solid var(--line);font:600 14px/1.45 var(--f-body);color:var(--ink)}
.encadre .meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:12px;font-size:11.5px;color:var(--faint)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:0;padding:6px 12px;font-size:12.5px;font-weight:500}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn[disabled]{opacity:.55;cursor:progress}
.mkt{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.mkt span{font:500 11.5px var(--f-mono);border-radius:0;padding:1px 7px;background:var(--accent-soft);color:var(--ink)}
.plain{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.plain li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-size:13.5px;line-height:1.45}
.plain .ic{font:600 13px var(--f-mono);color:var(--muted)}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.sect h3{font-size:16px;font-weight:700;}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-4px 0 10px;overflow-x:auto}
.tabs button{border:0;background:none;padding:7px 10px;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{font:10.5px var(--f-mono);fill:var(--muted)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .today{stroke:var(--ink);stroke-dasharray:3 3;stroke-width:1}
.ckey{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--muted);margin-top:6px}
.ckey i{display:inline-block;width:16px;height:0;border-top:2px solid var(--c);vertical-align:middle;margin-right:5px}
.ckey i.d{border-top-style:dashed}
.ckey i.b{height:9px;border:0;background:var(--c);border-radius:0}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{font:500 10.5px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.num{text-align:right;white-space:nowrap}
table.t th.num{text-align:right}
.tscroll{overflow-x:auto}
.st{font:500 11px var(--f-mono);white-space:nowrap}
.cal{display:grid;grid-template-columns:minmax(110px,1fr) repeat(12,minmax(11px,18px));gap:2px;align-items:center;font-size:12px}
.cal .m{font:10.5px var(--f-mono);color:var(--muted);text-align:center}
.cal .m.now{color:var(--ink);font-weight:600}
.cal .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:6px}
.cal .c{height:14px;border-radius:0;background:var(--line);opacity:.5}
.cal .c.l1{background:var(--accent);opacity:.28}
.cal .c.l2{background:var(--accent);opacity:.58}
.cal .c.l3{background:var(--accent);opacity:1}
.cal .c.now{outline:1.5px solid var(--ink);outline-offset:1px}
.foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:grid;gap:6px;max-width:980px}
.foot a{color:var(--accent)}
.muted{color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
[data-view="public"] .analyst-only{display:none!important}
[data-view="analyst"] .public-only{display:none!important}
.err{color:var(--s3);font-size:12px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font:inherit;text-decoration:underline;text-underline-offset:2px}
.livedot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--s0);margin-right:6px;vertical-align:1px;box-shadow:0 0 0 3px color-mix(in srgb,var(--s0) 25%,transparent)}

/* touches terminal */
.layers button[aria-pressed="true"]{background:var(--accent)!important;color:#000!important;border-color:var(--accent)!important;font-weight:700}
.chip[aria-pressed="true"]{border-color:var(--accent)!important;color:var(--accent)!important;box-shadow:inset 0 0 0 1px var(--accent)!important}
.btn{background:var(--accent)!important;border-color:var(--accent)!important;color:#000!important;font-weight:700}
.brand h1{color:var(--accent)}
.brand p{color:var(--muted)}
.eyebrow,.fgroup h3,.legend .t,.encadre dt,table.t th,.score .l{color:var(--accent)!important}
.seg button[aria-pressed="true"]{background:var(--accent)!important;color:#000!important}
.top{border-top-width:3px}
.card{border-top-color:var(--line)!important}
.card.encadre{border-top-color:var(--line)!important}
.alist button:hover,.alist button:focus-visible{background:#15191F}
.fresh{color:var(--faint)}
a{color:#4AA3FF}
.tip{background:#1A1F27!important;color:var(--ink)!important;border:1px solid var(--accent)}
</style>

<div class="wrap" id="app" data-view="public">
  <header class="top">
    <div class="brand">
      <h1>Commodity Weather Index</h1>
      <p>Anomalies météo des grandes ceintures agricoles et leur lecture marché</p>
    </div>
    <div class="seg" role="group" aria-label="Niveau de lecture">
      <button id="v-public" aria-pressed="true">Grand public</button>
      <button id="v-analyst" aria-pressed="false">Analyste</button>
    </div>
    <div class="spacer"></div>
    <div class="counts" id="counts"></div>
    <div class="fresh" id="fresh"></div>
  </header>

  <main class="grid">
    <aside class="filters" aria-label="Filtres">
      <div class="fgroup cult" id="f-cult"><h3>Commodités</h3></div>
      <div class="fgroup"><h3>Continents</h3><div class="chips" id="f-cont"></div></div>
      <div class="fgroup"><h3>Sévérité minimale</h3><div class="chips" id="f-sev"></div></div>
    </aside>

    <section class="mapcol" aria-label="Carte mondiale">
      <div class="maphead">
        <div class="layers" id="layers" role="group" aria-label="Couche affichée"></div>
      </div>
      <div class="mapbox" id="mapbox">
        <svg id="map" role="img" aria-label="Carte mondiale des zones de production"></svg>
        <div class="zoomctl"><button id="zin" aria-label="Zoomer">+</button><button id="zout" aria-label="Dézoomer">-</button><button id="zreset" aria-label="Vue mondiale" style="font-size:12px">⌂</button></div>
        <div class="legend" id="legend"></div>
        <div class="tip" id="tip" role="status"></div>
      </div>
      <p class="mapnote" id="mapnote"></p>
    </section>

    <section class="feed" aria-label="Fil d'alertes">
      <h2>Fil d'alertes <span class="eyebrow" id="feeddate"></span></h2>
      <ul class="alist" id="alist"></ul>
    </section>

    <aside class="fiche" id="fiche" aria-live="polite"></aside>
  </main>

  <footer class="foot" id="foot"></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<!--DATA-->
<script>
(() => {
const D0 = window.OSC_DATA, W = window.OSC_WORLD, NORM = window.OSC_NORMALS || {};
const D = {...D0};  // état courant : remplacé par le recalcul en direct quand il réussit
const app = document.getElementById('app');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MOIS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const MOIS1 = ['J','F','M','A','M','J','J','A','S','O','N','D'];
const fdate = iso => { const [y,m,d] = iso.slice(0,10).split('-').map(Number); return `${d} ${MOIS[m-1]} ${y}`; };
const fday = iso => { const [,m,d] = iso.slice(0,10).split('-').map(Number); return `${d} ${MOIS[m-1]}`; };
const SEV = {0:'Aucune alerte',1:'Vigilance',2:'Alerte',3:'Alerte élevée',4:'Alerte critique'};
const sevVar = s => `var(--s${s||0})`;
const store = { get(k,d){ try{ const v = localStorage.getItem('osc:'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} }, set(k,v){ try{ localStorage.setItem('osc:'+k, JSON.stringify(v)); }catch(e){} } };
const zones = D0.zones.map(z => ({...z, sev: z.alertes.length ? z.alertes[0].severite : 0}));
const byId = Object.fromEntries(zones.map(z => [z.id, z]));
let month = Number(D.date_du_jour.slice(5,7));
const live = {status: 'idle', at: null};

const GROUPS = [
  {id:'cereales', label:'Céréales', kw:['Maïs','Blé','Riz']},
  {id:'oleag', label:'Oléagineux', kw:['Soja','Canola','Colza','Tournesol']},
  {id:'cafe', label:'Café', kw:['Café']},
  {id:'cacao', label:'Cacao', kw:['Cacao']},
  {id:'sucre', label:'Sucre', kw:['Canne','Betterave']},
  {id:'coton', label:'Coton', kw:['Coton']},
  {id:'palme', label:'Huile de palme', kw:['palme']},
  {id:'oj', label:"Jus d'orange", kw:['Oranges']},
  {id:'the', label:'Thé', kw:['Thé']},
];
const zoneGroups = z => GROUPS.filter(g => z.cultures.some(c => g.kw.some(k => c.includes(k)))).map(g => g.id);
zones.forEach(z => z.groups = zoneGroups(z));
const CONTS = ['Amérique du Nord','Amérique du Sud','Afrique','Europe','Asie','Océanie'];
const LAYERS = [
  {id:'risk', label:'Score de risque'},
  {id:'tx', label:'Températures, 7 j prévus'},
  {id:'pr30', label:'Pluie, 30 derniers jours'},
  {id:'pr14', label:'Pluie prévue, 14 j'},
];
const state = {
  view: store.get('view','public'), groups: new Set(GROUPS.map(g => g.id)), conts: new Set(CONTS),
  sevMin: 0, layer: store.get('layer','risk'), sel: null, tab: 'temp', llm: {},
};
const topZone = () => [...zones].sort((a,b) => b.score - a.score)[0].id;
state.sel = topZone();

/* ================= moteur de calcul (miroir de pipeline/metrics.py) ================= */
const MIN_NORMAL_MM = 15;
const SEV_LABELS = {1:'Vigilance',2:'Alerte',3:'Alerte élevée',4:'Alerte critique'};
const REF = Date.UTC(2000,0,1);
const doy = iso => { const [,m,d] = iso.split('-').map(Number); return Math.round((Date.UTC(2000,m-1,d) - REF) / 864e5); };
const avg = a => a.reduce((s,x) => s + x, 0) / a.length;
const rnd = (x, nd=1) => x == null ? null : Number(x.toFixed(nd));
const pkey = (lat, lon) => `${lat.toFixed(2)}_${lon.toFixed(2)}`;
function pctRank(v, sample){ if (!sample || !sample.length || v == null) return null; let b = 0; for (const s of sample){ if (s < v) b++; else if (s === v) b += .5; } return Math.round(100 * b / sample.length); }
function computeMetrics(s){

  const v = (k, rg) => rg.map(i => s[k][i]).filter(x => x != null);

  const nsum = rg => rg.some(i => s.npr[i] == null) ? null : rg.reduce((a,i) => a + s.npr[i], 0);

    pr_fc14_mm: Math.round(pf), pr_fc14_normal: nf == null ? null : Math.round(nf),
    pr_fc14_pct: nf && nf >= 1 ? Math.round(100 * pf / nf) : null, pr_fc14_rank: pctRank(pf, s.clim_pr_fc14),

    normales: no != null && nf != null && ta != null,

}
function metricValue(m, r){

  return m[r.metrique] ?? null;
}
const hit = (v, op, t) => ({'<': v < t, '>': v > t, '>=': v >= t, '<=': v <= t})[op];
function confidence(r){
  if (r.metrique.includes('obs')) return ['élevée', 'le constat repose sur les 30 derniers jours, déjà écoulés'];
  if (r.metrique === 'pr_fc14_pct') return ['faible', "la pluie prévue au-delà d'une semaine reste très incertaine"];
  return ['moyenne', 'le signal vient des prévisions à 7-10 jours, fiables mais révisables'];
}
function evaluateZone(z, m, mon){
  const out = [];
  for (const r of z.regles){
    if (!r.mois.includes(mon)) continue;
    const val = metricValue(m, r);
    if (val == null || !hit(val, r.op, r.seuil)) continue;
    let sev = r.severite; if (r.severe != null && hit(val, r.op, r.severe)) sev = Math.min(4, sev + 1);
    const [c, why] = confidence(r);
    out.push({id:r.id, culture:r.culture, phenomene:r.phenomene, mecanisme:r.mecanisme, contrat:r.contrat, direction:r.direction, horizon:r.horizon,
      metrique:r.metrique, op:r.op, seuil:r.seuil, t:r.t ?? null, valeur:val, severite:sev, niveau:SEV_LABELS[sev], confiance:c, confiance_raison:why});

function riskScore(m, alerts, stages){

  const sens = Math.max(1, ...stages.map(c => c.niveau)) / 3;

const fr = x => String(x).replace('.', ',');
function calmBulletin(z, m, stages){

  const t = m.tx_fc7_anom;
  const temp = t == null ? `maximales jusqu'à ${fr(m.tx_fc7_max)} °C` : Math.abs(t) < 1.5 ? 'températures proches des normales' : `températures ${fr(Math.abs(t).toFixed(1))} °C ${t > 0 ? 'au-dessus' : 'en dessous'} des normales`;
  const pluie = m.pr_obs30_normal == null ? `${m.pr_obs30_mm} mm de pluie en 30 jours` : m.pr_obs30_normal >= 15 && m.pr_obs30_pct != null ? `pluie des 30 derniers jours à ${m.pr_obs30_pct} % de la normale` : 'saison sèche par nature';
  return `Aucun seuil critique franchi. Stade actuel : ${st}. Semaine à venir : ${temp} ; ${pluie}.`;
}
const METRIC_LABELS = {pr_obs30_pct:'pluie des 30 derniers jours en % de la normale', pr_fc14_pct:'pluie prévue sur 14 jours en % de la normale', tn_fc7_min:'température minimale prévue sur 7 jours (°C)', tx_fc7_max:'température maximale prévue sur 7 jours (°C)', n_tx_gt:'nombre de jours prévus au-dessus du seuil de chaleur sur 10 jours'};
function buildPayload(z){
  const a = z.alertes[0], m = {...z.metriques};

    contrats: a ? [...new Set(z.alertes.map(x => x.contrat))] : z.contrats, poids_mondial: z.poids_mondial,
    stade_actuel: z.stades.map(c => `${c.culture} : ${c.etape}`),
    phenomene: a ? a.phenomene : 'aucun seuil critique franchi', mecanisme_agronomique: a ? a.mecanisme : null, metrique: a ? a.metrique : null,
    regle: a ? {indicateur: METRIC_LABELS[a.metrique], valeur: a.valeur, seuil: a.seuil, seuil_chaleur_c: a.t} : null,
    mesures: m, severite: a ? a.severite : 0, niveau: a ? a.niveau : 'Aucune alerte',
    direction_attendue: a ? a.direction : 'neutre', horizon: a ? a.horizon : null,
    confiance: a ? {niveau: a.confiance, raison: a.confiance_raison} : null,

function templateEncadre(p){  // miroir de pipeline/llm.py template()
  const m = p.mesures, r = p.regle, sev = p.severite, key = p.metrique;
  let fait;
  if (key === 'pr_obs30_pct'){
    fait = `${m.pr_obs30_mm} mm de pluie sont tombés en 30 jours, soit ${m.pr_obs30_pct} % de la normale (${m.pr_obs30_normal} mm).`;
    const rk = m.pr_obs30_rank;
    if (rk === 0) fait += " C'est plus sec que chacune des années 1991-2020.";
    else if (rk === 100) fait += " C'est plus humide que chacune des années 1991-2020.";
    else if (rk != null && rk <= 10) fait += ` Un cumul aussi faible n'arrive que ${rk} années sur 100.`;
    else if (rk != null && rk >= 90) fait += ` Un cumul aussi élevé n'arrive que ${100 - rk} années sur 100.`;
  } else if (key === 'pr_fc14_pct') fait = `Les modèles prévoient ${m.pr_fc14_mm} mm de pluie sur les 14 prochains jours, soit ${m.pr_fc14_pct} % de la normale.`;
  else if (key === 'tn_fc7_min') fait = `Les minimales prévues descendent jusqu'à ${fr(m.tn_fc7_min)} °C dans les 7 prochains jours (seuil d'alerte : ${fr(r.seuil)} °C).`;
  else if (key === 'n_tx_gt') fait = `${r.valeur} jours au-dessus de ${r.seuil_chaleur_c} °C sont prévus sur les 10 prochains jours, avec un pic à ${fr(m.tx_fc7_max)} °C.`;
  else fait = `${r.indicateur} : ${fr(r.valeur)} (seuil ${fr(r.seuil)}).`;
  const ta = m.tx_fc7_anom;
  if (ta != null && Math.abs(ta) >= 1.5 && key !== 'n_tx_gt') fait += ` Les maximales de la semaine seraient ${fr(Math.abs(ta))} °C ${ta > 0 ? 'au-dessus' : 'en dessous'} des normales.`;

    impact_marche: marche,
    a_surveiller: key === 'pr_obs30_pct' ? `Les pluies à venir : ${m.pr_fc14_mm} mm sont attendus sur 14 jours.` : 'Les prochains runs des modèles, qui peuvent encore corriger ce signal.',
    confiance: `${p.confiance.niveau[0].toUpperCase()}${p.confiance.niveau.slice(1)} : ${p.confiance.raison}.`,
    resume_une_ligne: `${p.phenomene} -> ${p.culture} -> ${p.contrats[0]}`,
    direction: p.direction_attendue, intensite: sev >= 2 ? 'modérée' : 'faible', source: 'gabarit',

/* ================= recalcul en direct à l'ouverture ================= */
const LIVE_TTL = 60 * 60 * 1000;
function uniquePoints(){ const seen = new Map(); zones.forEach(z => z.points.forEach(p => { const k = pkey(p[0], p[1]); if (!seen.has(k)) seen.set(k, [p[0], p[1]]); })); return [...seen.entries()]; }
async function fetchLive(){
  const cached = store.get('live', null);
  if (cached && Date.now() - cached.at < LIVE_TTL && cached.n === uniquePoints().length) return cached;
  const pts = uniquePoints();
  const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + pts.map(p => p[1][0]).join(',') + '&longitude=' + pts.map(p => p[1][1]).join(',')
    + '&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,et0_fao_evapotranspiration&past_days=30&forecast_days=16&timezone=GMT&models=best_match';
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 20000);
  const res = await fetch(url, {signal: ctl.signal}); clearTimeout(tm);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  let j = await res.json(); if (!Array.isArray(j)) j = [j];
  const keys = ['temperature_2m_max','temperature_2m_min','precipitation_sum','et0_fao_evapotranspiration'];
  const out = {at: Date.now(), n: pts.length, time: j[0].daily.time, points: {}};
  pts.forEach(([k], i) => { out.points[k] = keys.map(x => j[i].daily[x]); });
  store.set('live', out);
  return out;
}
function applyLive(L){
  const i0 = 30, times = L.time, today = times[i0];
  const sameDay = Math.abs((Date.parse(today) - Date.parse(D0.date_du_jour)) / 864e5) <= 2;
  D.time = times; D.i0 = i0; D.date_du_jour = today; month = Number(today.slice(5,7));
  const feed = [];
  zones.forEach(z => {
    const keys = z.points.map(p => pkey(p[0], p[1])), w = z.points.map(p => p[2]);
    const agg = v => times.map((_, i) => { let s = 0, sw = 0; keys.forEach((k, j) => { const x = L.points[k]?.[v]?.[i]; if (x != null){ s += x * w[j]; sw += w[j]; } }); return sw ? rnd(s / sw) : null; });
    const N = NORM[z.id] || {}, pick = n => times.map(t => N[n] ? N[n][doy(t)] : null);
    const sdx = pick('sdtx');
    const s = {i0, tx: agg(0), tn: agg(1), pr: agg(2), et0: agg(3), ntx: pick('ntx'), ntn: pick('ntn'), npr: pick('npr'),
      sdtx: sdx.every(x => x != null) ? avg(sdx) : null,
      clim_pr_obs30: sameDay ? z.clim?.clim_pr_obs30 : null, clim_pr_fc14: sameDay ? z.clim?.clim_pr_fc14 : null};
    const m = computeMetrics(s);
    z.stades = z.calendrier.filter(c => c.mois.includes(month));
    const orig = D0.zones.find(x => x.id === z.id);
    z.alertes = evaluateZone(z, m, month);
    z.metriques = m; z.series = {tx: s.tx, tn: s.tn, pr: s.pr, et0: s.et0, ntx: s.ntx, ntn: s.ntn, npr: s.npr};
    z.score = riskScore(m, z.alertes, z.stades); z.sev = z.alertes.length ? z.alertes[0].severite : 0;
    if (!z.alertes.length){ z.encadre = null; z.bulletin = calmBulletin(z, m, z.stades); }
    else if (orig?.encadre && orig.encadre.alerte_id === z.alertes[0].id){ z.encadre = {...orig.encadre, ecrit_le: D0.genere_le}; z.bulletin = null; }
    else { z.encadre = templateEncadre(buildPayload(z)); z.bulletin = null; }
    z.alertes.forEach(a => feed.push({zone: z.id, nom: z.nom, pays: z.pays, culture: a.culture, phenomene: a.phenomene, severite: a.severite, niveau: a.niveau, contrat: a.contrat, direction: a.direction}));
  });

}
async function goLive(force){
  if (force) store.set('live', null);
  live.status = 'loading'; renderTop();
  try {
    const L = await fetchLive();
    applyLive(L); live.status = 'ok'; live.at = L.at;
    if (!state.picked) state.sel = topZone();
    renderTop(); drawZones(); renderFeed(); renderFiche(); renderLegend();
  } catch (e) {
    live.status = 'off'; renderTop();
  }
}

/* ================= échelles de couleur ================= */
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const txScale = d3.scaleDiverging(t => d3.interpolateRdBu(1 - t)).domain([-4, 0, 4]).clamp(true);
const prScale = d3.scaleDiverging(d3.interpolateBrBG).domain([-2, 0, 2]).clamp(true);
const prLog = pct => pct == null ? null : Math.log2(Math.max(pct, 5) / 100);
function zoneColor(z){
  const m = z.metriques;
  if (state.layer === 'risk') return z.sev ? css('--s'+z.sev) : css('--s0');
  if (state.layer === 'tx') return m.tx_fc7_anom == null ? css('--faint') : txScale(m.tx_fc7_anom);
  const pct = state.layer === 'pr30' ? m.pr_obs30_pct : m.pr_fc14_pct;
  const normal = state.layer === 'pr30' ? m.pr_obs30_normal : m.pr_fc14_normal;
  if (pct == null || normal == null || normal < 15) return css('--faint');
  return prScale(prLog(pct));
}
const sign = v => v == null ? 'n.d.' : (v > 0 ? '+' : v < 0 ? '−' : '±') + Math.abs(v).toFixed(1).replace('.', ',');
const signC = v => v == null ? 'n.d.' : sign(v) + ' °C';
const n1 = v => v == null ? 'n.d.' : Number(v).toFixed(1).replace('.', ',');
function zoneValueText(z){
  const m = z.metriques;
  if (state.layer === 'risk') return `Score ${z.score}/100 · ${SEV[z.sev]}`;
  if (state.layer === 'tx') return m.tx_fc7_anom == null ? `Tmax jusqu'à ${n1(m.tx_fc7_max)} °C (normales en cours de calcul)` : `Tmax ${sign(m.tx_fc7_anom)} °C vs normale (7 j)`;
  const pct = state.layer === 'pr30' ? m.pr_obs30_pct : m.pr_fc14_pct;
  const normal = state.layer === 'pr30' ? m.pr_obs30_normal : m.pr_fc14_normal;
  const mm = state.layer === 'pr30' ? m.pr_obs30_mm : m.pr_fc14_mm;
  if (normal == null) return `Pluie ${mm} mm (normales en cours de calcul)`;
  if (normal < 15) return 'Saison sèche : pluie normale quasi nulle';
  return `Pluie ${pct} % de la normale (${mm} mm)`;
}
function visible(z){ return z.groups.some(g => state.groups.has(g)) && state.conts.has(z.continent) && z.sev >= state.sevMin; }

/* ================= barre supérieure ================= */
function renderTop(){
  const c = [4,3,2,1].map(s => [s, zones.filter(z => z.sev === s).length]).filter(([,n]) => n);
  $('counts').innerHTML = c.length ? c.map(([s,n]) => `<span class="pill" style="--c:${sevVar(s)}"><span class="dot"></span>${n} ${SEV[s].toLowerCase()}</span>`).join('') : '<span class="pill"><span class="dot"></span>Aucune alerte</span>';
  const hm = t => new Date(t).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
  let line;
  if (live.status === 'ok') line = `<span class="livedot"></span>En direct · prévisions de ${hm(live.at)}`;
  else if (live.status === 'loading') line = 'Mise à jour en direct…';
  else line = `Dernier calcul : ${fdate(D0.genere_le)}, ${D0.genere_le.slice(11,16)} UTC`;
  $('fresh').innerHTML = `${line}<br>${zones.length} zones suivies${live.status === 'ok' || live.status === 'off' ? ' · <button class="linkbtn" id="refresh">Actualiser</button>' : ''}`;

/* ================= filtres ================= */
function renderFilters(){
  const fc = $('f-cult');
  fc.querySelectorAll('label').forEach(l => l.remove());
  GROUPS.forEach(g => {
    const n = zones.filter(z => z.groups.includes(g.id)).length;
    const lab = document.createElement('label'); lab.className = 'chk';
    lab.innerHTML = `<input type="checkbox" id="g-${g.id}" ${state.groups.has(g.id)?'checked':''}> ${esc(g.label)} <span class="n">${n}</span>`;
    lab.querySelector('input').onchange = e => { e.target.checked ? state.groups.add(g.id) : state.groups.delete(g.id); refresh(); };
    fc.appendChild(lab);
  });
  $('f-cont').innerHTML = CONTS.map((c,i) => `<button class="chip" id="c-${i}" aria-pressed="${state.conts.has(c)}">${esc(c)}</button>`).join('');
  CONTS.forEach((c,i) => $('c-'+i).onclick = () => { state.conts.has(c) ? state.conts.delete(c) : state.conts.add(c); renderFilters(); refresh(); });
  const sevs = [[0,'Toutes les zones'],[1,'Vigilance +'],[2,'Alerte +'],[3,'Élevée +']];
  $('f-sev').innerHTML = sevs.map(([s,l]) => `<button class="chip" id="s-${s}" aria-pressed="${state.sevMin===s}">${l}</button>`).join('');
  sevs.forEach(([s]) => $('s-'+s).onclick = () => { state.sevMin = s; renderFilters(); refresh(); });
}

/* ================= carte ================= */
const svg = d3.select('#map');
let proj, path, gRoot, zoom, curK = 1;
function initMap(){
  const w = 1000;
  proj = d3.geoEqualEarth().rotate([-10,0]).fitWidth(w - 16, W);
  path = d3.geoPath(proj);
  const bb = path.bounds(W), h = Math.ceil(bb[1][1] - bb[0][1]) + 16;
  proj.translate([proj.translate()[0] + 8, proj.translate()[1] - bb[0][1] + 8]);
  svg.attr('viewBox', `0 0 ${w} ${h}`);
  svg.selectAll('*').remove();
  gRoot = svg.append('g');
  gRoot.append('path').attr('class','grat').attr('d', path(d3.geoGraticule10()));
  gRoot.append('g').selectAll('path').data(W.features).join('path').attr('class','land').attr('d', path);
  gRoot.append('g').attr('id','zlayer');
  gRoot.append('g').attr('id','llayer');
  zoom = d3.zoom().scaleExtent([1, 8]).translateExtent([[0,0],[w,h]]).on('zoom', e => { curK = e.transform.k; gRoot.attr('transform', e.transform); drawZones(); });
  svg.call(zoom).on('dblclick.zoom', null);
  $('zin').onclick = () => svg.transition().duration(300).call(zoom.scaleBy, 1.6);
  $('zout').onclick = () => svg.transition().duration(300).call(zoom.scaleBy, 1/1.6);
  $('zreset').onclick = () => svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity);
}
function drawZones(){
  const pts = [];
  zones.forEach(z => { const top = z.points.reduce((b, p, i) => p[2] > z.points[b][2] ? i : b, 0);
    z.points.forEach((p, i) => { const xy = proj([p[1], p[0]]); pts.push({z, i, main: i === top, x: xy[0], y: xy[1], r: 3.5 + 2.4 * Math.sqrt(p[2])}); }); });
  const k = curK, zl = d3.select('#zlayer');
  zl.selectAll('circle.zpulse').data(pts.filter(p => p.main && p.z.sev >= 2 && visible(p.z)), d => d.z.id)
    .join('circle').attr('class','zpulse').attr('cx', d => d.x).attr('cy', d => d.y).attr('r', d => d.r / k)
    .attr('stroke', d => css('--s'+d.z.sev)).attr('stroke-width', 1.6 / k);

    .on('mousemove', (e, d) => showTip(e, d.z)).on('mouseleave', hideTip);

    .attr('class','zring').attr('cx', d => d.x).attr('cy', d => d.y).attr('r', d => (d.r + 4) / k).attr('stroke-width', 2.2 / k);
  const labs = pts.filter(p => p.main && visible(p.z) && (p.z.sev >= 2 || p.z.id === state.sel || k >= 2.5));
  d3.select('#llayer').selectAll('text').data(labs, d => d.z.id).join('text').attr('class','zlabel')
    .attr('x', d => d.x + (d.r + 5) / k).attr('y', d => d.y + 4 / k).attr('font-size', 11 / k).attr('stroke-width', 3 / k)
    .text(d => shortName(d.z));

function scoreGauge(z){

    <path d="${arc.endAngle(Math.PI*0.75)()}" transform="translate(${cx},${cy})" fill="var(--line)"/>
    <path d="${arc.endAngle(-Math.PI*0.75 + a)()}" transform="translate(${cx},${cy})" fill="${sevVar(z.sev)}"/>
    <text x="${cx}" y="${cy+6}" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="var(--ink)">${z.score}</text></svg>`;
}

    ${z.alertes.length > 1 ? `<p class="hint" style="margin:8px 0 0">Autres signaux : ${z.alertes.slice(1).map(a => esc(a.phenomene.toLowerCase())).join(', ')}.</p>` : ''}

function llmControls(z){

function rankText(r){
  if (r == null) return '';

  if (r === 100) return 'Plus humide que chacune des années 1991-2020.';
  if (r <= 10) return `Un total aussi faible n'arrive que ${r} années sur 100.`;
  if (r >= 90) return `Un total aussi élevé n'arrive que ${100 - r} années sur 100.`;
  return 'Dans la fourchette habituelle des 30 dernières années.';
}

function renderTab(z){

const CW = 400, CH = 210, M = {l:32, r:10, t:10, b:22};
function xScale(){ return d3.scaleLinear().domain([0, D.time.length-1]).range([M.l, CW-M.r]); }
function xAxis(x){
  let s = '';
  D.time.forEach((t,i) => { if ((i - D.i0) % 7 === 0) s += `<line class="gl" x1="${x(i)}" x2="${x(i)}" y1="${M.t}" y2="${CH-M.b}" opacity=".5"/><text class="ax" x="${x(i)}" y="${CH-6}" text-anchor="middle">${fday(t)}</text>`; });
  s += `<line class="today" x1="${x(D.i0)}" x2="${x(D.i0)}" y1="${M.t}" y2="${CH-M.b}"/><text class="ax" x="${x(D.i0)+4}" y="${M.t+9}">prévision →</text>`;
  return s;
}
function yAxis(y, fmt){ return y.ticks(5).map(v => `<line class="gl" x1="${M.l}" x2="${CW-M.r}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${M.l-5}" y="${y(v)+3.5}" text-anchor="end">${fmt(v)}</text>`).join(''); }
function tempChart(z){
  const s = z.series, x = xScale(), n = D.time.length, m = z.metriques;
  const all = [...s.tx, ...s.tn, ...s.ntx, ...s.ntn].filter(v => v != null);
  const y = d3.scaleLinear().domain([d3.min(all) - 2, d3.max(all) + 2]).nice().range([CH-M.b, M.t]);
  const band = d3.area().defined((d,i) => s.ntx[i] != null && s.ntn[i] != null).x((d,i) => x(i)).y0((d,i) => y(s.ntn[i])).y1((d,i) => y(s.ntx[i]));
  const ln = (arr, a, b) => d3.line().defined(d => d[1] != null).x(d => x(d[0])).y(d => y(d[1]))(arr.map((v,i) => [i,v]).slice(a,b)) || '';
  const nl = arr => d3.line().defined(d => d != null).x((d,i) => x(i)).y(d => y(d))(arr) || '';
  return `<div class="chart"><svg viewBox="0 0 ${CW} ${CH}" role="img" aria-label="Températures observées et prévues comparées aux normales">
    ${yAxis(y, v => v + '°')}${xAxis(x)}
    <path d="${band(s.ntx) || ''}" fill="var(--band)"/>
    <path d="${nl(s.ntx)}" fill="none" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 2"/>
    <path d="${nl(s.ntn)}" fill="none" stroke="var(--faint)" stroke-width="1" stroke-dasharray="2 2"/>
    <path d="${ln(s.tx, 0, D.i0+1)}" fill="none" stroke="var(--s3)" stroke-width="1.8"/>
    <path d="${ln(s.tx, D.i0, n)}" fill="none" stroke="var(--s3)" stroke-width="1.8" stroke-dasharray="4 3"/>
    <path d="${ln(s.tn, 0, D.i0+1)}" fill="none" stroke="var(--fc)" stroke-width="1.8"/>
    <path d="${ln(s.tn, D.i0, n)}" fill="none" stroke="var(--fc)" stroke-width="1.8" stroke-dasharray="4 3"/>
    </svg>
    <div class="ckey"><span><i style="--c:var(--s3)"></i>Tmax</span><span><i style="--c:var(--fc)"></i>Tmin</span><span><i class="d" style="--c:var(--ink)"></i>prévision</span><span><i class="b" style="--c:var(--band)"></i>normales 1991-2020</span></div>
    <p class="hint" style="margin:8px 0 0">Tmax 7 j : <span class="num">${signC(m.tx_fc7_anom)}</span> vs normale (z = <span class="num">${n1(m.tx_fc7_z)}</span>) · 7 j passés : <span class="num">${signC(m.tx_obs7_anom)}</span></p></div>`;
}
function rainChart(z){
  const s = z.series, x = xScale(), n = D.time.length, m = z.metriques;
  let cum = 0, ncum = 0, hasN = s.npr.every(v => v != null); const c = [], nc = [];
  s.pr.forEach((v,i) => { cum += v || 0; ncum += s.npr[i] || 0; c.push(cum); nc.push(ncum); });
  const yb = d3.scaleLinear().domain([0, Math.max(5, d3.max(s.pr))]).nice().range([CH-M.b, M.t]);
  const yc = d3.scaleLinear().domain([0, Math.max(10, d3.max(c), hasN ? d3.max(nc) : 0)]).nice().range([CH-M.b, M.t]);
  const bw = (CW - M.l - M.r) / n * 0.7;
  const bars = s.pr.map((v,i) => v ? `<rect x="${x(i)-bw/2}" y="${yb(v)}" width="${bw}" height="${yb(0)-yb(v)}" fill="${i<D.i0?'var(--rain)':'var(--rain-fc)'}"/>` : '').join('');
  const l = arr => d3.line().x((d,i) => x(i)).y(d => yc(d))(arr);
  const right = yc.ticks(4).map(v => `<text class="ax" x="${CW-M.r+4}" y="${yc(v)+3.5}">${v}</text>`).join('');
  return `<div class="chart"><svg viewBox="0 0 ${CW+24} ${CH}" role="img" aria-label="Pluie quotidienne et cumul comparé à la normale">
    ${yAxis(yb, v => v)}${xAxis(x)}${bars}
    ${hasN ? `<path d="${l(nc)}" fill="none" stroke="var(--faint)" stroke-width="1.5" stroke-dasharray="2 2"/>` : ''}
    <path d="${l(c)}" fill="none" stroke="var(--ink)" stroke-width="1.8"/>${right}
    </svg>
    <div class="ckey"><span><i class="b" style="--c:var(--rain)"></i>pluie du jour (mm, axe gauche)</span><span><i class="b" style="--c:var(--rain-fc)"></i>prévue</span><span><i style="--c:var(--ink)"></i>cumul (mm, axe droit)</span>${hasN ? '<span><i class="d" style="--c:var(--faint)"></i>cumul normal</span>' : ''}</div>
    <p class="hint" style="margin:8px 0 0">30 j : <span class="num">${m.pr_obs30_mm} mm</span>${m.pr_obs30_normal != null ? ` pour une normale de <span class="num">${m.pr_obs30_normal} mm</span>` : ''}${m.pr_obs30_rank != null ? ` (rang ${m.pr_obs30_rank}/100)` : ''} · bilan pluie - ETP : <span class="num">${m.wb_obs30} mm</span></p></div>`;
}
function indTable(z){
  const m = z.metriques, nd = v => v == null ? 'n.d.' : v;
  const rows = [
    ['Tmax moyenne, 7 j prévus', signC(m.tx_fc7_anom), 'écart à la normale'],
    ['Tmax, z-score 7 j', n1(m.tx_fc7_z), 'écart / écart-type journalier'],
    ['Tmax moyenne, 7 j passés', signC(m.tx_obs7_anom), 'écart à la normale'],
    ['Tmin moyenne, 7 j prévus', signC(m.tn_fc7_anom), 'écart à la normale'],
    ['Tmax la plus haute, 7 j', n1(m.tx_fc7_max) + ' °C', 'prévision'],
    ['Tmin la plus basse, 7 j', n1(m.tn_fc7_min) + ' °C', 'prévision'],
    ['Pluie, 30 j passés', m.pr_obs30_mm + ' mm', `normale ${nd(m.pr_obs30_normal)} mm · ${nd(m.pr_obs30_pct)} % · rang ${nd(m.pr_obs30_rank)}`],
    ['Pluie, 14 j prévus', m.pr_fc14_mm + ' mm', `normale ${nd(m.pr_fc14_normal)} mm · ${nd(m.pr_fc14_pct)} % · rang ${nd(m.pr_fc14_rank)}`],
    ['Bilan pluie - ETP, 30 j', m.wb_obs30 + ' mm', "négatif = sol qui s'assèche"],
  ];
  return `<div class="tscroll"><table class="t"><thead><tr><th>Indicateur</th><th class="num">Valeur</th><th>Référence</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td>${r[0]}</td><td class="num">${r[1]}</td><td class="muted">${r[2]}</td></tr>`).join('')}</tbody></table></div>
    <p class="hint" style="margin:8px 0 0">Rang = position du cumul actuel parmi les 30 années 1991-2020 (0 = le plus sec, 100 = le plus humide). n.d. = normale pas encore disponible.</p>`;
}
const METRIC = {pr_obs30_pct:'Pluie 30 j (% normale)', pr_fc14_pct:'Pluie prévue 14 j (% normale)', tn_fc7_min:'Tmin la plus basse 7 j (°C)', tx_fc7_max:'Tmax la plus haute 7 j (°C)', n_tx_gt:'Jours > {t} °C sur 10 j'};
function ruleValue(z, r){
  if (r.metrique === 'n_tx_gt'){ return z.series.tx.slice(D.i0, D.i0+10).filter(t => t != null && t > r.t).length; }
  const m = z.metriques;
  if (r.metrique.endsWith('_pct')){ const normal = m[r.metrique.replace('_pct','_normal')]; if (normal == null || normal < 15) return null; }
  return m[r.metrique];
}
function rulesTable(z){
  const rows = z.regles.map(r => {
    const active = r.mois.includes(month), hitA = z.alertes.find(a => a.id === r.id), v = ruleValue(z, r);
    const normalMissing = r.metrique.endsWith('_pct') && z.metriques[r.metrique.replace('_pct','_normal')] == null;
    const st = hitA ? `<span class="st" style="color:${sevVar(hitA.severite)}">● ${SEV[hitA.severite]}</span>` : !active ? '<span class="st muted">hors saison</span>' : normalMissing ? '<span class="st muted">normale en calcul</span>' : v == null ? '<span class="st muted">saison sèche</span>' : '<span class="st" style="color:var(--s0)">○ non franchi</span>';
    return `<tr><td>${esc(r.phenomene)}<br><span class="muted">${esc(r.culture)} · ${r.mois.map(m => MOIS1[m-1]).join('')}</span></td>
      <td>${esc(METRIC[r.metrique].replace('{t}', r.t))}</td><td class="num">${v == null ? '-' : String(v).replace('.', ',')} ${r.op} ${String(r.seuil).replace('.', ',')}</td><td>${st}</td></tr>`;
  }).join('');
  return `<div class="tscroll"><table class="t"><thead><tr><th>Règle</th><th>Indicateur</th><th class="num">Valeur / seuil</th><th>Statut</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="hint" style="margin:8px 0 0">Seuils agronomiques de départ, à recalibrer par backtest. La sévérité monte d'un cran quand le seuil sévère est aussi franchi.</p>`;
}

/* ================= rédaction par Claude (dans claude.ai uniquement) ================= */
let sampleFn;
async function runLLM(z){
  const sample = sampleFn; if (!sample) return;
  const ctl = new AbortController();
  state.llm[z.id] = {...(state.llm[z.id]||{}), busy: true, ctl, msg: 'Claude réfléchit…', err: false};
  renderFiche();
  const p = buildPayload(z);
  const extra = p.severite === 0 ? "\nCAS SANS ALERTE : 60 à 90 mots, dis clairement que l'impact de marché attendu est limité, direction \"neutre\"." : '';
  const prompt = D0.system_prompt + extra + '\n\n<alerte>\n' + JSON.stringify(p) + '\n</alerte>';
  try {
    const out = await sample.json(prompt, {signal: ctl.signal, cache: false, onText: () => { const s = state.llm[z.id]; if (s && s.msg !== 'Rédaction…'){ s.msg = 'Rédaction…'; const el = $('llm-msg'); if (el) el.textContent = s.msg; } }});
    if (!out || !out.ce_qui_se_passe) throw {code: 'invalid_json'};
    state.llm[z.id] = {out, busy: false, msg: 'Nouvelle version affichée pour cette session.'};
  } catch (e) {
    const copy = {cancelled: 'Rédaction arrêtée.', not_granted: 'Rédaction par Claude non autorisée sur cette page.', rate_limited: 'Trop de demandes, réessayez dans un moment.', invalid_json: 'Réponse inexploitable, réessayez.', sampling_disabled: "Claude n'est pas disponible pour ce compte."};
    state.llm[z.id] = {...(state.llm[z.id]||{}), busy: false, err: e.code !== 'cancelled', msg: copy[e.code] || 'La rédaction a échoué, réessayez.'};
    if (['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e.code)) sampleFn = null;
  }
  if (state.sel === z.id) renderFiche();
}

/* ================= pied de page ================= */
function renderFoot(){
  $('foot').innerHTML = `<div><b>Méthode.</b> Chaque zone est suivie par plusieurs points représentatifs, pondérés selon leur part dans la production${D0.poids_source ? ` (${esc(D0.poids_source)})` : ' (estimation)'}. Les 30 derniers jours proviennent des analyses des modèles, les 16 suivants des prévisions (sélection automatique Open-Meteo : ECMWF, GFS, ICON…), récupérées en direct à l'ouverture de la page. Les normales sont calculées sur 1991-2020 (réanalyse ERA5), lissées sur ±7 jours. Le moteur de règles croise ces indicateurs avec le calendrier cultural de chaque zone ; les encadrés sont rédigés chaque matin.</div>
  <div><b>Sources.</b> ${D0.sources.map(esc).join(' · ')} · <a href="https://open-meteo.com/" target="_blank" rel="noopener">open-meteo.com</a> (CC BY 4.0).</div>
  <div><b>Avertissement.</b> Information sur les conditions météo et leurs mécanismes, pas une recommandation d'investissement. Aucun prix n'est prévu ici.</div>`;
}

function refresh(){ drawZones(); renderFeed(); if (!visible(byId[state.sel])){ const f = zones.filter(visible).sort((a,b) => b.score-a.score)[0]; if (f) state.sel = f.id; } renderFiche(); }

renderTop(); renderFilters(); renderLayers(); initMap(); renderLegend(); renderFeed(); renderFoot();
setView(state.view);
drawZones();
goLive(false);
(async () => {
  try { sampleFn = window.claude ? await window.claude.use('sample') : null; } catch (e) { sampleFn = null; }
  renderFiche();
})();
})();
</script>
